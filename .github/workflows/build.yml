name: Build

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27 (preview image): the iOS 27 SDK has the audio schemas the new Siri uses
    # (Koda/Intents/SiriSchemas.swift). Without it that file is left out and the app still builds.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Test KodaCore
        working-directory: KodaCore
        run: swift test

      - name: Build unsigned app
        run: |
          # Without pipefail the job passes on tail's exit status even when the build fails.
          set -o pipefail
          xcodebuild -project Koda.xcodeproj -scheme Koda -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | tail -n 40 \
            || { echo "::group::Errors"; grep -E "error:" build.log | sort -u | head -100; echo "::endgroup::"; exit 1; }

      # The app and its widgets share a folder (an App Group) so the Now Playing widget can show
      # what's playing. The installer's signer only gives the app what the bundle says it wants,
      # and reads that from the code signature: so each bundle gets an ad-hoc one that carries
      # the entitlement and nothing else (AltStore and SideStore then make a group of the
      # installer's own and say which in ALTAppGroups; see Shared/WidgetShare.swift).
      - name: Declare the app group
        run: |
          set -euo pipefail
          app=build/Build/Products/Release-iphoneos/Koda.app
          # Inside out: a bundle's signature covers the ones in it.
          codesign --force --sign - "$app/PlugIns/KodaShare.appex"
          codesign --force --sign - --entitlements Koda-iOS.entitlements "$app/PlugIns/KodaWidgets.appex"
          codesign --force --sign - --entitlements Koda-iOS.entitlements "$app"
          codesign --verify --deep --strict "$app"
          for bundle in "$app" "$app/PlugIns/KodaWidgets.appex"; do
            codesign -d --entitlements - --xml "$bundle" 2>/dev/null | grep -q group.ivors.Koda \
              || { echo "::error::$bundle doesn't declare the app group"; exit 1; }
          done

      # Not signed for any device: AltStore, SideStore and Sideloadly sign it with the installer's own Apple ID.
      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Koda.app Payload/
          zip -qry Koda.ipa Payload
          ls -lh Koda.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: Koda-${{ github.sha }}
          path: Koda.ipa
          retention-days: 30

  # The Mac app: SwiftUI on AppKit (target KodaMac), one binary for Apple silicon and Intel.
  # Ad-hoc signed: Apple silicon refuses to run unsigned code, and without a Developer ID there
  # is nothing better to sign with. Same bundle id as the Catalyst app it replaced, so it opens
  # the same library, settings and Keychain items.
  mac:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build universal Mac app
        run: |
          set -o pipefail
          xcodebuild -project Koda.xcodeproj -scheme KodaMac -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log | tail -n 40 \
            || { echo "::group::Errors"; grep -E "error:" build.log | sort -u | head -100; echo "::endgroup::"; exit 1; }
          lipo -info build/Build/Products/Release/Koda.app/Contents/MacOS/Koda

      # The install window: Koda and Applications laid out on Packaging/dmg-background.tiff
      # by Finder, the disk wearing Koda's icon (see Packaging/make-dmg.sh).
      - name: Package .dmg
        run: |
          Packaging/make-dmg.sh build/Build/Products/Release/Koda.app Koda.dmg
          ls -lh Koda.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: Koda-mac-${{ github.sha }}
          path: Koda.dmg
          retention-days: 30
